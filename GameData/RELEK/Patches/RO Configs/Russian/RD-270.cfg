@PART[RK_26_RD270]:AFTER[RELEK]:FOR[RealismOverhaulEngines]
{
   @tags ^= :$: USSR kb energomash glushko rd-270 liquid pump booster udmh nto
   %specLevel = prototype
   @MODULE[ModuleEngines*]
   {
      %EngineType = LiquidFuel
   }
   !MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}
   MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		origMass = 4.47
		configuration = RD-270
		modded = false
      CONFIG
      {
         name = RD-270
         description = The large Full-Flow Staged Combustion [FFSC] engine that runs on UDMH and NTO, designed for the large UR-700 rocket for direct ascent lunar landings, to avoid a supposedly dangerous docking and reconfiguration.
         specLevel = prototype
         minThrust = 5957
         maxThrust = 6272
         heatProduction = 205
         ullage = true
         ignitions = 1
         PROPELLANT
         {
            name = UDMH
            ratio = 0.4042
            DrawGauge = True
         }
         PROPELLANT
         {
            name = NTO
            ratio = 0.5958
            DrawGauge = False
         }
         atmosphereCurve
         {
            key = 0 322
            key = 1 301
         }
         IGNITOR_RESOURCE
         {
            name = UDMH
            amount = 0.41
         }
         IGNITOR_RESOURCE
         {
            name = NTO
            amount = 0.59
         }
         TESTFLIGHT:NEEDS[TestLite|TestFlight] // never flew, uses ROE numbers
			{
				testedBurnTime = 450		//same as Proton Uppers
				ratedBurnTime = 148
				safeOverburn = true

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				ignitionReliabilityStart = 0.989829
				ignitionReliabilityEnd = 0.997966
				cycleReliabilityStart = 0.989829
				cycleReliabilityEnd = 0.997966
				techTransfer = RD-253-Mk3,RD-253-Mk2,RD-253:25
			}
      }
      CONFIG
      {
         name = RD-270M
         description = The large Full-Flow Staged Combustion [FFSC] engine, this time it runs on Pentaborane.
         specLevel = prototype
         minThrust = 6801
         maxThrust = 7159
         heatProduction = 205
         ullage = true
         ignitions = 1
         PROPELLANT
         {
            name = PB-1
            ratio = 0.5256
            DrawGauge = True
         }
         PROPELLANT
         {
            name = NTO
            ratio = 0.4744
            DrawGauge = True
         }
         atmosphereCurve
         {
            key = 0 365
            key = 1 340
         }
         IGNITOR_RESOURCE
         {
            name = PB-1
            amount = 0.52
         }
         IGNITOR_RESOURCE
         {
            name = NTO
            amount = 0.48
         }
         TESTFLIGHT:NEEDS[TestLite|TestFlight] // never flew, uses ROE numbers
			{
				testedBurnTime = 450		//same as Proton Uppers
				ratedBurnTime = 148
				safeOverburn = true

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				ignitionReliabilityStart = 0.989829
				ignitionReliabilityEnd = 0.997966
				cycleReliabilityStart = 0.989829
				cycleReliabilityEnd = 0.997966
				techTransfer = RD-253-Mk3,RD-253-Mk2,RD-253:25
			}
      }
   }
}
@PART[RK_26_RD270]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG,*
		{
			%LinkB9PSModule[engineSwitch] { subtype = RD270 }
		}
		@CONFIG[RD-270M]
		{
			@LinkB9PSModule[engineSwitch] { @subtype = RD270M }
		}
	}
}
@PART[ROE-RD270]:AFTER[RealismOverhaulEngines]
{
   %title = #roRD270Title + [DEPRECATED BY RELEK]
}