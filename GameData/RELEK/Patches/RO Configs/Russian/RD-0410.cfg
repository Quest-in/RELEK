@PART[RK_26_RD0410]:AFTER[RELEK]:FOR[RealismOverhaulEngines]
{
   @tags ^= :$: USSR KB Khimavtomatika rd-0410 11b91 nuclear pump upper lqdhydrogen
   %specLevel = prototype
   @MODULE[ModuleEngines*]
   {
      %EngineType = LiquidFuel
   }
   	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}
   MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		origMass = 2
		configuration = RD-0410
		modded = false
      CONFIG
      {
         name = RD-0410
         description = Russian LH2 nuclear engine developed from 1964 through to 1994, with testing happening primarily in the 1980s
         specLevel = prototype
         minThrust = 35.3
         maxThrust = 35.3
         heatProduction = 450
         ullage = true
         ignitions = 0
         PROPELLANT
         {
            name = LqdHydrogen
            ratio = 1
            DrawGauge = True
         }
         PROPELLANT
         {
            name = EnrichedUranium
            ratio = 0.5958
            DrawGauge = True
         }
         atmosphereCurve
         {
            key = 0 910
            key = 1 561
         }
		 IGNITOR_RESOURCE
		{	
        	name = electricCharge
			amount = 0.1
    	}
        %chamberNominalTemp = 3000
		%maxEngineTemp = 3500
            TESTFLIGHT:NEEDS[TestLite|TestFlight] // ripping ROE testflight yet again
			{
				ratedBurnTime = 36000 // 10 hours
				ratedContinuousBurnTime = 3600 // 1 hour

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				explicitDataRate = True
				ignitionReliabilityStart = 0.99
				ignitionReliabilityEnd = 0.999997
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.999
				cycleReliabilityEnd = 0.999997
				reliabilityMidV = 0.8
				reliabilityMidH = 0.1
				reliabilityMidTangentWeight = 0
				reliabilityDataRateMultiplier = 100 // due to the burn time
			}
        }
    }
    MODULE // rip RO rescource converter config as it should work
    {
		name				   = ModuleResourceConverter
		ConverterName		   = Turbine Generator
		StartActionName		   = Start
		StopActionName		   = Stop
		AlwaysActive		   = true
		FillAmount			   = 1.000
		AutoShutdown		   = false
		GeneratesHeat		   = false
		TemperatureModifier	   = 2.000
		UseSpecializationBonus = false
		DefaultShutoffTemp	   = 0.500

		INPUT_RESOURCE
		{
			ResourceName = EnrichedUranium
			Ratio		 = 1e-13
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio		 = 1.500
		}

		OUTPUT_RESOURCE
		{
			ResourceName = DepletedUranium
			Ratio		 = 1e-13
		}
	}
	RESOURCE
	{
		name = EnrichedUranium
		amount = 0.3	//3.29 kg
		maxAmount = 0.3
	}
	RESOURCE
	{
		name = DepletedUranium
		amount = 0
		maxAmount = 0.3
	}
}